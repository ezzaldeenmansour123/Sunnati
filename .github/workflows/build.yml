name: Build SUNNATI APK

# Phases 9-10 (v1.0.0): build the app + full library DB, run tests, publish
# a release APK. `test/` is NEVER deleted — a failing test fails the build.
# Signing: release builds need the KEYSTORE_BASE64 / KEYSTORE_PASSWORD /
# KEY_ALIAS / KEY_PASSWORD secrets (see SIGNING.md). A push build without
# them is DEBUG-signed with a loud warning and must never be distributed;
# a TAG build (a real release) without them FAILS outright.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          # 3.50.1, not 3.24.5: pubspec.lock requires flutter >=3.47.0
          # (generated with 3.50.1), and all local verification
          # (flutter analyze 0 errors, flutter test 130/130) ran on 3.50.1.
          flutter-version: "3.50.1"
          channel: stable

      - name: Set up Java 17 (keytool — signing verification)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Guard — pubspec version matches the single source of truth
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          CODE_VERSION=$(grep -oP "appVersion = '\K[^']+" lib/core/app_version.dart)
          CODE_BUILD=$(grep -oP "appBuildNumber = \K[0-9]+" lib/core/app_version.dart)
          if [ "$PUBSPEC_VERSION" != "${CODE_VERSION}+${CODE_BUILD}" ]; then
            echo "ERROR: pubspec version ($PUBSPEC_VERSION) != lib/core/app_version.dart (${CODE_VERSION}+${CODE_BUILD})"
            exit 1
          fi
          echo "Version OK: $PUBSPEC_VERSION"

      - name: Flutter pub get
        run: flutter pub get

      # The library database is built FIRST because the library-v1
      # publish step below uploads it AND `flutter build apk` embeds
      # it. (Embed 2026-11-26, owner decision 16:54: the library ships
      # INSIDE the APK — the DB is built here into assets/sunnati.db,
      # published to library-v1, and embedded via the pubspec asset
      # entry. narrators.db is built by the next step from its vendored
      # builder + data — owner override 2026-11-26 17:51.)
      - name: Build the library database (Phases 2-3 — full import)
        run: |
          pip install pyarrow
          python3 tools/build_db.py --out assets/sunnati.db \
            --data-dir sunnati-data/parquet \
            --log-json /tmp/sunnati-build-log.json
          ls -l assets/sunnati.db assets/sunnati.db.sha256

      # The narrators database is built here into assets/narrators.db
      # (OWNER OVERRIDE 2026-11-26 17:51 — the owner ordered it EMBEDDED
      # in the APK, overriding the KITAB gate for the in-app copy).
      # tools/build_narrators_db.py rebuilds the verified Phase 5 core
      # (500 narrators / 500 grades / 7,808 identity matches) from its
      # vendored inputs in tools/narrators-data/ and ASSERTS every
      # count before writing; it never downloads anything. The built
      # file is embedded via the pubspec asset entry and is NEVER
      # uploaded to the library-v1 release (see the KITAB-gate guard
      # below — the publish step uploads sunnati.db only).
      - name: Build the narrators database (Phase 5 core — embedded)
        run: |
          python3 tools/build_narrators_db.py --out assets/narrators.db
          test "$(sha256sum assets/narrators.db | cut -d' ' -f1)" = "$(cat assets/narrators.db.sha256)"
          python3 -c "import sqlite3; c = sqlite3.connect('assets/narrators.db'); assert c.execute('SELECT COUNT(*) FROM narrators').fetchone()[0] == 500; assert c.execute('SELECT COUNT(*) FROM narrator_grades').fetchone()[0] == 500; assert c.execute(\"PRAGMA quick_check\").fetchone()[0] == 'ok'; print('narrators.db OK: 500 narrators, 500 grades, quick_check ok')"
          ls -l assets/narrators.db assets/narrators.db.sha256

      - name: Apply verified isnad links (Phase 5 core — reviewed scope)
        # build_db.py creates the narrator tables EMPTY. Without this step
        # a CI-built library would ship 0 parser candidates and 0 verified
        # links, silently disabling tap-a-narrator. Seeds exactly the
        # reviewed scope (1,500-hadith sample) from tools/verified_links.json
        # and FAILS the build on any count mismatch. Also verifies the
        # narrators DB built by the previous step against its SHA-256
        # (embedded by owner override 2026-11-26 17:51; absence fails
        # the build).
        run: |
          python3 tools/apply_verified_links.py --db assets/sunnati.db \
            --log-json /tmp/verified-links-log.json
          # The .sha256 assets hold a bare hash (see build_db.py: the app
          # compares the trimmed file content to the computed hash), so
          # verify by explicit comparison, not `sha256sum -c`.
          # narrators.db is built by the previous step (owner override
          # 2026-11-26 17:51 — embedded in the APK): it MUST exist here
          # and its hash MUST match, or the build fails. It is still
          # never uploaded to any release (see the guard below).
          test -f assets/narrators.db
          test "$(sha256sum assets/narrators.db | cut -d' ' -f1)" = "$(cat assets/narrators.db.sha256)"
          test "$(sha256sum assets/sunnati.db | cut -d' ' -f1)" = "$(cat assets/sunnati.db.sha256)"
          ls -l assets/sunnati.db assets/narrators.db

      # KITAB GATE — SAFETY NET. narrators.db (OpenITI Taqrib,
      # CC BY-NC-SA 4.0) must NEVER be published/distributed as a
      # standalone file in any form until KITAB replies — owner override
      # 2026-11-26 17:51 covers ONLY the in-app embed inside the APK,
      # never a public file release. This step FAILS the build if (a)
      # any `gh release upload` line in this workflow names
      # narrators.db, or (b) the library-v1 release already carries a
      # narrators asset. Building assets/narrators.db in CI and
      # embedding it in the APK is NOT a publication under this guard
      # — it is the owner's explicit order; the guard watches the
      # release channel only.
      - name: Guard — narrators.db is NEVER published (KITAB gate)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -E 'upload[[:space:]]+library-v1.*narrators\.db' .github/workflows/build.yml; then
            echo 'ERROR: KITAB gate — a release upload names narrators.db. Refusing to publish.'
            exit 1
          fi
          if gh release view library-v1 --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'narrators'; then
            echo 'ERROR: KITAB gate — the library-v1 release already carries a narrators asset.'
            exit 1
          fi
          echo 'KITAB gate guard OK: narrators.db is not published.'

      # Embed decision (2026-11-26, owner 16:54): the APK embeds
      # sunnati.db AND CI publishes the same built, verified library +
      # its SHA-256 sidecar to the `library-v1` release as an external
      # copy for reference/recovery (the app downloads it only on the
      # recovery screen, when the embedded install failed). Runs on
      # every push to main so the external copy always matches the
      # embedded one; --clobber replaces the previous files.
      # narrators.db is NEVER uploaded here (see the guard step above).
      - name: Publish library data package (library-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view library-v1 >/dev/null 2>&1; then
            gh release create library-v1 \
              --title 'SUNNATI library data v1' \
              --notes 'Core library data (sunnati.db) — the same file embedded in the SUNNATI APK; published by CI after the verified-links step as an external copy for reference/recovery. The narrators package is NOT published here (KITAB gate).'
          fi
          gh release upload library-v1 assets/sunnati.db assets/sunnati.db.sha256 --clobber
          gh release view library-v1 --json assets --jq '.assets[].name'

      - name: Download Amiri font (SIL OFL 1.1, google/fonts)
        run: |
          mkdir -p assets/fonts
          curl -fL -o assets/fonts/Amiri-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          curl -fL -o assets/fonts/Amiri-Bold.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          ls -l assets/fonts/

      - name: Verify launcher icon (owner's v2 image, committed PNGs)
        run: |
          pip install Pillow numpy
          python3 tools/make_icon_from_source.py --out android/app/src/main/res --check
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Analyse (must pass)
        run: flutter analyze

      - name: Install libsqlite3 (host SQLite for DB-backed tests)
        # DB-backed tests open a real SQLite file through package:sqlite3,
        # which loads `libsqlite3.so` on Linux. The ubuntu runner ships
        # only libsqlite3.so.0 — the dev symlink is what the loader
        # needs. No package download: the runtime library is already
        # present; only the unversioned symlink is missing.
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 /usr/lib/x86_64-linux-gnu/libsqlite3.so
          sudo ldconfig
          test -f /usr/lib/x86_64-linux-gnu/libsqlite3.so

      - name: Test (must pass — test/ is never deleted)
        run: flutter test

      - name: Ensure Gradle wrapper jar
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fL -o android/gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          fi
          ls -l android/gradle/wrapper/

      - name: Set up release signing (if secrets are configured)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            {
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storeFile=keystore.jks"
            } > android/key.properties
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Release keystore configured. Certificate fingerprint (SHA-256):"
            keytool -list -v -keystore android/app/keystore.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null \
              | grep -E "SHA256:|Alias name:" || echo "WARNING: could not read keystore fingerprint — check alias/password."
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "WARNING: KEYSTORE_BASE64 secret not set — this build will be DEBUG-signed. Do NOT distribute it as a release."
          fi

      - name: Guard — a tagged release MUST be release-signed
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]] && [ "$HAS_KEYSTORE" != "true" ]; then
            echo "ERROR: building tag ${{ github.ref }} without a release keystore. Set the signing secrets (see SIGNING.md) — a debug-signed tag must never be published as a release."
            exit 1
          fi
          echo "Signing guard OK (ref=${{ github.ref }}, HAS_KEYSTORE=$HAS_KEYSTORE)."

      - name: Install stable debug keystore (shared CI signature)
        # Belt-and-braces for the Gradle debug signing config (see
        # android/app/build.gradle): even if that assignment is ever
        # ignored, AGP's DEFAULT debug keystore (~/.android/debug.keystore)
        # is this committed one, so every CI build shares one signature
        # and installs as a normal update. Public debug credentials
        # (storePassword "android", alias "androiddebugkey") — install
        # identity only, no security. Run #98 proved the Gradle path fix
        # alone was not enough (its APK still carried a fresh cert).
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
          ls -l ~/.android/debug.keystore

      - name: Build release APK (single arm64-v8a APK)
        # One APK on purpose: the target test device is a Samsung Galaxy
        # S22 Ultra (arm64-v8a). --split-per-abi is required (not a
        # multi-APK decision): without it `flutter build apk` writes the
        # universal name app-release.apk, but the Verify / Upload /
        # Release steps below all expect app-arm64-v8a-release.apk
        # (run #51 failed exactly here: the build produced
        # app-release.apk (68.8MB) and Verify could not find the split name).
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Verify APK + SHA-256 + signing certificate
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          sha256sum "$APK" | tee "$APK.sha256"
          ls -l "$APK"
          echo "APK signing certificate (SHA-256 fingerprint — compare with SIGNING.md):"
          keytool -printcert -jarfile "$APK" 2>/dev/null | grep -E "SHA256:|Owner:" || echo "WARNING: could not read APK certificate."

      - name: Guard — APK embeds the library AND narrators.db
        # Embed decisions (owner 2026-11-26 16:54 + OVERRIDE 17:51):
        # the APK MUST contain assets/sunnati.db (the library ships
        # inside the app, ~190 MB uncompressed) AND assets/narrators.db
        # (the narrators ship inside the app by the owner's explicit
        # 17:51 order, overriding the KITAB gate for the in-app copy).
        # The 50 MB floor is the tripwire: a ~25 MB APK means an asset
        # did not embed. No upper bound — the owner accepted a bigger
        # APK. narrators.db is still NEVER uploaded to the library-v1
        # release (see the "NEVER published" guard above — the release
        # channel is a different thing from the APK embed).
        run: |
          set -euo pipefail
          APK=$(ls build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "APK assets:"
          unzip -l "$APK" | grep -E 'assets/' || true
          if ! unzip -l "$APK" | grep -q 'assets/sunnati.db'; then
            echo 'ERROR: APK does not embed assets/sunnati.db — the library must ship inside the APK (owner decision 2026-11-26 16:54).'
            exit 1
          fi
          if ! unzip -l "$APK" | grep -q 'assets/narrators.db'; then
            echo 'ERROR: APK does not embed assets/narrators.db — the narrators must ship inside the APK (owner override 2026-11-26 17:51).'
            exit 1
          fi
          APK_BYTES=$(stat -c%s "$APK")
          echo "APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -lt 50000000 ]; then
            echo "ERROR: APK is only $APK_BYTES bytes — the ~190 MB library cannot be embedded in it. The asset must be missing from the build."
            exit 1
          fi
          echo 'APK content guard OK: sunnati.db + narrators.db embedded.'

      - name: Upload APK artifact (push builds — verification only, no public release)
        # Push builds never publish a public release: a public release is
        # created only from a deliberate tag (after the signing secrets
        # and the KITAB licence gate are cleared). A push build without
        # the keystore is debug-signed and must never be distributed.
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: sunnati-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
          retention-days: 14

      - name: Publish release v1.0.0-build-${{ github.run_number }}
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: SUNNATI v1.0.0 (build ${{ github.run_number }})
          body: |
            SUNNATI v1.0.0 — the Nine Books (65,712 hadiths) + 3,574
            HadeethEnc commentaries + 67,334 grader-attributed grades +
            lexical semantic search. The core library is embedded in
            the APK (no download needed); the same file is also
            published to the library-v1 data release for
            reference/recovery. The narrators package (500 verified
            narrators from Taqrib al-Tahdhib, CC BY-NC-SA 4.0) is
            embedded in the APK by the owner's order of 2026-11-26
            (KITAB confirmation still unanswered — see Sources in the
            app) and is never published as a standalone file. Full
            build report: SUNNATI_FULL_BUILD_REPORT_2026-11-26.md.
            Device: Samsung Galaxy S22 Ultra (arm64-v8a).
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sha256
