name: Generate SUNNATI release keystore (one-time)

# ONE-TIME ONLY. Run once, manually, to create the release signing key.
# After this runs successfully, NEVER run it again — a second keystore is a
# different signing identity and would break updates for installed users.
#
# Prerequisites (set BEFORE running — GitHub repo Settings → Secrets → Actions):
#   KEYSTORE_PASSWORD — store password (strong, saved in a password manager)
#   KEY_PASSWORD      — key password (strong, saved in a password manager)
#   KEY_ALIAS         — key alias, e.g. sunnati-release
#
# What this workflow does:
#   1. Generates ONE keystore with keytool (RSA 2048, SHA256withRSA,
#      validity 10,000 days) using the secrets above as passwords.
#   2. Prints ONLY the SHA-256 certificate fingerprint — never the key,
#      never any password, never the base64.
#   3. Uploads the keystore as an artifact `sunnati-release-keystore`
#      (7-day retention, visible only to repo collaborators).
#
# After the run:
#   1. Download the artifact immediately and back the .jks up in TWO safe
#      offline places (see SIGNING.md — losing it loses the signing identity).
#   2. Base64 it and set the KEYSTORE_BASE64 secret:
#        base64 -w0 sunnati-release.jks   (then paste the single line)
#   3. DELETE the artifact from the workflow run — the key must not linger.
#   4. Compare the fingerprint printed by the next release build with the
#      fingerprint printed by this run before distributing any APK.
#
# Safety: this workflow never prints secrets. The keystore password is
# passed to keytool via environment (masked by GitHub when echoed).
# The workflow refuses to run twice: it fails if KEYSTORE_BASE64 is
# already set, so an accidental re-run cannot silently replace the key.

on:
  workflow_dispatch:
    inputs:
      distinguished_name:
        description: "Certificate distinguished name (CN=owner, O=SUNNATI)"
        required: true
        default: "CN=Ezzaldeen Mansour, O=SUNNATI"

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse if a release keystore already exists
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is already set — a release keystore exists. Generating another one would break updates. Aborting."
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ERROR: set KEYSTORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS secrets first (see SIGNING.md)."
            exit 1
          fi
          echo "No existing keystore secret — proceeding with one-time generation."

      - name: Set up Java 17 (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the release keystore (once)
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DNAME: ${{ inputs.distinguished_name }}
        run: |
          keytool -genkeypair \
            -keystore sunnati-release.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "$DNAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS"
          ls -l sunnati-release.jks
          echo "Certificate fingerprint (SHA-256) — RECORD THIS, it identifies every future release build:"
          keytool -list -v -keystore sunnati-release.jks \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
            | grep -E "Alias name:|SHA256:|Valid from:"

      - name: Upload keystore artifact (7 days — download + delete!)
        uses: actions/upload-artifact@v4
        with:
          name: sunnati-release-keystore
          path: sunnati-release.jks
          retention-days: 7
          if-no-files-found: error
