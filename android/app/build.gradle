plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: reads android/key.properties (created in CI from the
// KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets).
// The keystore itself is NEVER in the repo (see .gitignore).
// If key.properties is absent, the release build falls back to the DEBUG
// signing config and prints a loud warning — a debug-signed "release" must
// never be distributed silently. This is the Ezz-alsonah lesson applied
// from day one: signing is decided before the first shipped build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println("WARNING: key.properties not found — release APK will use DEBUG signing. Do NOT distribute this build as a release.")
}

android {
    namespace "com.sunnati.app"
    compileSdk 36

    defaultConfig {
        // FIXED from day one — never change after the first shipped build,
        // or installed users cannot update.
        applicationId "com.sunnati.app"
        minSdk 21
        targetSdk 36
        // Single source of truth for versionCode/versionName is pubspec.yaml;
        // the Flutter Gradle plugin reads them from local.properties into the
        // `flutter` extension — Flutter 3.50 template form. The old bare
        // `flutterVersionCode` project property no longer exists (run #44
        // failed here: "Could not get unknown property 'flutterVersionCode'").
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        // Stable debug keystore (tools/debug.keystore, fingerprint
        // 70:85:3F:3B...): the CI workflow copies it to
        // ~/.android/sunnati-debug.keystore and writes
        // android/key.properties pointing at it. AGP 9 in this project
        // nevertheless signs the release APK with a fresh per-runner
        // certificate no matter which keystore the release config points
        // at (runs #97-#110) — so push builds do NOT use this config at
        // all: they build unsigned (see buildTypes below) and the
        // workflow signs the APK once with apksigner. The debug config
        // stays empty (default) and manages ~/.android/debug.keystore on
        // its own. A real release key (GitHub Secrets, see SIGNING.md)
        // still takes precedence via key.properties for tagged builds.
        // NOTE: the build signed with the lost per-run key (build 81)
        // still needs ONE final uninstall first; updates work forever
        // after that.
        debug {
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Signing is decided by the workflow, not here. Push builds
            // (no release secrets: HAS_KEYSTORE != "true") build UNSIGNED:
            // AGP 9 in this project signs the release APK with a fresh
            // per-runner certificate no matter which keystore the release
            // config points at (runs #97-#110), and re-signing that APK
            // with apksigner produced a third mystery certificate (run
            // #110). So the workflow signs the unsigned APK once with
            // apksigner and the stable debug keystore. Tagged builds with
            // real secrets (HAS_KEYSTORE == "true") keep Gradle signing
            // with the release keystore.
            if (System.getenv("HAS_KEYSTORE") == "true" && keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9 built-in Kotlin: the old kotlinOptions DSL is gone; the
    // compiler target is set through the kotlin extension instead.
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

flutter {
    source "../.."
}

// Diagnostic (runs #97-#104 all shipped a fresh cert despite every
// keystore mechanism): print the RESOLVED signing configs so the CI log
// proves what the release build actually signs with. Remove once the
// stable signature is confirmed in a delivered APK.
afterEvaluate {
    def rsc = android.buildTypes.release.signingConfig
    println("RESOLVED RELEASE SIGNING: name=${rsc?.name} storeFile=${rsc?.storeFile} storeType=${rsc?.storeType} keyAlias=${rsc?.keyAlias}")
    def dsc = android.signingConfigs.debug
    println("RESOLVED DEBUG SIGNING: name=${dsc?.name} storeFile=${dsc?.storeFile} storeType=${dsc?.storeType} keyAlias=${dsc?.keyAlias}")
}

dependencies {}
