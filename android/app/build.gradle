plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: reads android/key.properties (created in CI from the
// KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets).
// The keystore itself is NEVER in the repo (see .gitignore).
// If key.properties is absent, the release build falls back to the DEBUG
// signing config and prints a loud warning — a debug-signed "release" must
// never be distributed silently. This is the Ezz-alsonah lesson applied
// from day one: signing is decided before the first shipped build.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    println("WARNING: key.properties not found — release APK will use DEBUG signing. Do NOT distribute this build as a release.")
}

android {
    namespace "com.sunnati.app"
    compileSdk 36

    defaultConfig {
        // FIXED from day one — never change after the first shipped build,
        // or installed users cannot update.
        applicationId "com.sunnati.app"
        minSdk 21
        targetSdk 36
        // Single source of truth for versionCode/versionName is pubspec.yaml;
        // the Flutter Gradle plugin reads them from local.properties into the
        // `flutter` extension — Flutter 3.50 template form. The old bare
        // `flutterVersionCode` project property no longer exists (run #44
        // failed here: "Could not get unknown property 'flutterVersionCode'").
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        // Stable debug keystore — committed in the repo at tools/debug.keystore
        // (owner decision 2026-11-26). Why: every GitHub runner generates a
        // FRESH ~/.android/debug.keystore, so each CI build used to carry a
        // DIFFERENT signature and Android refused to install it over the
        // previous build ("package appears to be invalid"), forcing the user
        // to uninstall and lose favorites/notes. This committed keystore is
        // used for the debug signing config, so every CI build — debug or
        // release-without-secrets — shares ONE signature and installs as a
        // normal update. It is a DEBUG (trial) key with the public standard
        // Android credentials (storePassword "android", alias
        // "androiddebugkey", keyPassword "android"): install identity only,
        // no security. A real release key (GitHub Secrets, see SIGNING.md)
        // still takes precedence below and must replace it before any store
        // release. NOTE: the build signed with the lost per-run key
        // (build 81) still needs ONE final uninstall first; updates work
        // forever after that. If the file is ever absent, the config falls
        // back to AGP's default per-machine debug keystore.
        debug {
            // Path is relative to the Gradle root project (android/), so
            // the repo-root tools/ dir is one level up. (Was
            // rootProject.file("tools/debug.keystore") — that resolves to
            // android/tools/debug.keystore, which does not exist, so the
            // `if` was silently false and every CI build fell back to a
            // fresh per-runner debug keystore. Run #97 proved it: its APK
            // cert was 8A:C8:39:95..., not this keystore's 70:85:3F:3B....)
            def stableDebugKeystore = rootProject.file("../tools/debug.keystore")
            // Diagnostic (run #98 still shipped a fresh cert despite the
            // path fix — this line proves in the Gradle log what path was
            // resolved and whether the file was seen). The workflow also
            // installs this keystore as ~/.android/debug.keystore (as JKS),
            // so the default debug keystore is the stable one even if this
            // assignment is ever ignored.
            println("STABLE DEBUG KEYSTORE: ${stableDebugKeystore.absolutePath} exists=${stableDebugKeystore.exists()}")
            if (stableDebugKeystore.exists()) {
                storeFile stableDebugKeystore
                // The committed keystore is PKCS12 (not the JKS AGP
                // assumes by default) — say so explicitly, or the load
                // fails and AGP silently regenerates a fresh debug key.
                storeType "pkcs12"
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // AGP 9 built-in Kotlin: the old kotlinOptions DSL is gone; the
    // compiler target is set through the kotlin extension instead.
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

flutter {
    source "../.."
}

dependencies {}
