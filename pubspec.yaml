name: sunnati
description: "سُنَّتي | SUNNATI — السنة النبوية بين يديك، بفهم موثّق وذكاء متقدم. مكتبة حديثية عربية دون إنترنت، الكتب التسعة."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  share_plus: ^13.0.0 # 13.x: Android build uses build.gradle.kts with
  # flutter.compileSdkVersion and no kotlin-android plugin — required for
  # AGP 9 (10.1.4/11.x/12.x still apply kotlin-android + compileSdk 34,
  # which fails run #45). API: Share.share is deprecated in 13.x, use
  # SharePlus.instance.share(ShareParams(...)) — see hadith_reader_screen.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # NOTE (embed 2026-11-26, owner decision 16:54 + OVERRIDE 17:51):
    # the core library (sunnati.db) AND the narrators DB
    # (narrators.db) ship INSIDE the APK — CI builds both fresh each
    # run into assets/ (see .github/workflows/build.yml) and the app
    # installs them from the assets on first run. The 17:51 owner
    # order («بجميع قواعده بكل شيء») EXPLICITLY overrides the KITAB
    # gate for the in-app copy: narrators.db is embedded by his direct
    # order although the KITAB confirmation request is still
    # unanswered (CC BY-NC-SA 4.0 risk — documented in the app's
    # Sources screen and in lib/data/database.dart). narrators.db is
    # STILL never published as a standalone file to the public
    # library-v1 release. The assistant phrasings stay embedded
    # (small, needed offline).
    - assets/sunnati.db
    - assets/narrators.db
    - assets/assistant_phrasings.json
    # Home brand header image (owner's v2 icon, 512 px legacy PNG).
    - assets/app_icon.png
  fonts:
    # Amiri (SIL OFL 1.1) — يُحمَّل في CI من مصدر موثّق (انظر .github/workflows/build.yml).
    # إن غاب الخط في بيئة البناء سقط Flutter تلقائياً إلى خط النظام؛ لا يُسلَّم APK بخط غير مرخّص.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
